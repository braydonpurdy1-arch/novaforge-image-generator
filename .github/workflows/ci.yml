name: NovaForge Image Studios CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/**]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GEMINI_API_KEY: test-placeholder-not-a-real-key
          NOVAFORGE_API_TOKEN: test-placeholder-not-a-real-token
