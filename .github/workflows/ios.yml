name: iOS

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/NovaForgeImageStudios/NovaForgeImageStudios.xcodeproj \
            -scheme NovaForgeImageStudios \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            clean test
